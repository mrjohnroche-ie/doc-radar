# The thing that makes this a radar rather than a snapshot.
#
# Every Monday morning it asks TMDB what is coming out, rebuilds and commits.
# That push is all it takes: Vercel is watching the repo and redeploys on its
# own, so this workflow never needs Vercel credentials and there is no deploy
# step here to go wrong.
#
# It does not run on push. A push is already a deploy - Vercel handles it - and
# re-fetching on every markup change would spend API quota for nothing.
name: Refresh

on:
  schedule:
    # 06:00 UTC every Monday. Weekly rather than monthly on purpose: release
    # dates move, and a date that shifted three weeks ago is worse than useless.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      resolve:
        description: 'Also re-resolve TMDB ids from data/sources.json'
        type: boolean
        default: false

permissions:
  contents: write

# Never cancel a run mid-flight. A half-written calendar is the one outcome
# worse than a late one.
concurrency:
  group: doc-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the key is there
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::TMDB_API_KEY is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Only when asked. Id resolution involves a judgement call about which
      # "Neon" is the right one, and that judgement belongs in a commit someone
      # looked at, not in a job that runs while everyone is asleep.
      - name: Resolve TMDB ids
        if: inputs.resolve
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/resolve-sources.mjs

      - name: Fetch releases
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch.mjs

      - name: Build
        run: node build.mjs

      - name: Commit, which is what triggers the deploy
        run: |
          git config user.name  "doc-radar"
          git config user.email "noreply@github.com"
          git add data/releases.json data/sources.resolved.json dist
          if git diff --staged --quiet; then
            echo "Nothing changed this week. No deploy needed."
          else
            git commit -m "Refresh releases for $(date -u +'%d %B %Y')"
            git push
          fi
